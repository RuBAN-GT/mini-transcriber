name: Build and verify desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2022
            arch: x64
          - target: macos-arm64
            os: macos-14
            arch: arm64
          - target: macos-x64
            os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            vendor/ffmpeg
            vendor/ffmpeg-source
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
        id: ffmpeg-cache
      - name: Windows compiler
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: base-devel mingw-w64-x86_64-gcc curl tar xz
      - name: Build LGPL FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh
      - name: Build LGPL FFmpeg (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh
      - name: Save compiled FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/ffmpeg
            vendor/ffmpeg-source
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - name: Build and verify Windows EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Build and verify macOS app
        if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item README.md, THIRD_PARTY.md dist/MiniTranscriber/
          Compress-Archive -Path dist/MiniTranscriber -DestinationPath release/MiniTranscriber-${{ matrix.target }}.zip
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/MiniTranscriber.app release/MiniTranscriber-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            vendor/ffmpeg-source/*.log
            build/MiniTranscriber/warn-*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MiniTranscriber-${{ matrix.target }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish tested archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --verify-tag --title "Mini Transcriber $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
